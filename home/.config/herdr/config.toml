# herdr のキーバインドを tmux のデフォルトに揃える(プレフィックスは Ctrl+b のまま)

# 初回起動時のオンボーディング(セットアップウィザード)をスキップする。
# 未設定だと herdr がウィザード完了時に onboarding = false を設定ファイルへ書き込むが、
# このファイルは mkOutOfStoreSymlink でリポジトリ内の実体へ直接リンクされており、
# リンク越しの書き込みはリポジトリ管理下のファイルに届いてしまうため、先回りしてコミットしておく
# (zshrc で起きた同種の問題は docs/decisions/zshrc-pollution.md 参照)。
# トップレベルキーのため、TOML の仕様上どのセクションよりも前に置く必要がある。
onboarding = false

[keys]
# プレフィックスキー + % でペインを垂直分割、+ " で水平分割(tmuxのデフォルト split-window -h/-v に合わせる。
# herdr 自体のデフォルトは prefix+v / prefix+minus のため明示的に上書きする)
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

# ワークスペース選択(navigate mode)を矢印キーだけでなく hjkl でも操作できるようにする
# (ペイン移動 h/j/k/l はデフォルトで既に有効。ワークスペース上下だけデフォルトが矢印キーのみだった)
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[ui]
agent_panel_sort = "priority"

# バックグラウンドのエージェントが完了・入力待ちになったときの通知。
# デフォルト(off)は効果音のみ。"terminal" で外側のターミナル(WezTerm)へ
# OSC 9 を送り、ターミナル経由で OS の通知として出す(herdr を見ていないときも気づける)。
# - WSL でも効く: WezTerm は WSLENV で TERM_PROGRAM を WSL 側へ渡すため、herdr が
#   WezTerm を検出できる。"system" は WSL では notify-send になり Windows に届かないため不採用
# - SSH 越しの herdr でも手元のターミナルに届く
# - アクティブなタブの通知は抑制されるが、ターミナル自体が非フォーカスなら通知される
# - 対応ターミナル(WezTerm/Ghostty/iTerm2/kitty)以外で起動すると通知は出ない(音は鳴る)
# - アプリ内トースト("herdr")とは排他
# 遅延はデフォルト(1秒)のまま。
[ui.toast]
delivery = "terminal"

[experimental]
# pane画面履歴のディスク永続化(session-history.json)。pane出力にはAPIキー・
# プロンプト・token等が含まれ得るため、原則として永続化しない。
# 現行(0.8.0)のデフォルトも false だが、experimental な機能はデフォルトが
# 変わり得るため、セキュリティ上の判断として明示的に固定しておく
# (公式も「config/sessionディレクトリはターミナル履歴と同様に扱え」と注意している)。
pane_history = false

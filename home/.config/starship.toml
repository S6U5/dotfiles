"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#FFC2D1)\
$os\
$username\
[](bg:#FFE0B2 fg:#FFC2D1)\
$directory\
[](fg:#FFE0B2 bg:#C8F4C8)\
$git_branch\
$git_status\
[](fg:#C8F4C8 bg:#B3E0FF)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#B3E0FF bg:#D9C2F5)\
$docker_context\
[](fg:#D9C2F5 bg:#FFB3D9)\
$time\
[ ](fg:#FFB3D9)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#FFC2D1 fg:#333333"
style_root = "bg:#FFC2D1 fg:#333333"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#FFC2D1 fg:#333333"
disabled = true # Disabled by default

[directory]
style = "bg:#FFE0B2 fg:#333333"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#D9C2F5 fg:#333333"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#C8F4C8 fg:#333333"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#C8F4C8 fg:#333333"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#B3E0FF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#FFB3D9 fg:#333333"
format = '[ ♥ $time ]($style)'

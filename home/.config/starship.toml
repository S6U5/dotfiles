"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#F2A9C4)\
$os\
$username\
[](bg:#FDE2C0 fg:#F2A9C4)\
$directory\
[](fg:#FDE2C0 bg:#F6C4D9)\
$git_branch\
$git_status\
[](fg:#F6C4D9 bg:#FFFFFF)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#FFFFFF bg:#EFA0C2)\
$docker_context\
[](fg:#EFA0C2 bg:#FFD59E)\
$cmd_duration\
[](fg:#FFD59E bg:#E1C2F6)\
$time\
[ ](fg:#E1C2F6)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#F2A9C4 fg:#333333"
style_root = "bg:#F2A9C4 fg:#333333"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#F2A9C4 fg:#333333"
disabled = true # Disabled by default

[directory]
style = "bg:#FDE2C0 fg:#333333"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#EFA0C2 fg:#333333"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#F6C4D9 fg:#333333"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#F6C4D9 fg:#333333"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#FFFFFF fg:#333333"
format = '[ $symbol ($version) ]($style)'

[cmd_duration]
min_time = 5000
style = "bg:#FFD59E fg:#333333"
format = '[  $duration ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#E1C2F6 fg:#333333"
format = '[  $time ]($style)'

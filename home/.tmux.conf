# プレフィックスキーを Ctrl+a に変更(デフォルトの Ctrl+b は解除)
set -g prefix C-a
unbind C-b

# プレフィックスキー + ^ でペインを垂直分割、+ - で水平分割
bind ^ split-window -h
bind - split-window -v

# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの文字色、背景色を変更
setw -g status-style fg=colour255,bg=colour234

# マウス操作を有効化
set-option -g mouse on

# クリップボード連携に使うコピーコマンドを OS ごとに自動選択(要 tmux 3.2+)
# 後勝ち: 下の行ほど優先(pbcopy=macOS、clip.exe=WSL、wl-copy/xclip=Linux)
if-shell 'command -v xclip >/dev/null'    'set -s copy-command "xclip -selection clipboard -in"'
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null' 'set -s copy-command "wl-copy"'
if-shell 'command -v clip.exe >/dev/null' 'set -s copy-command "clip.exe"'
if-shell 'command -v pbcopy >/dev/null'   'set -s copy-command "pbcopy"'

# マウスでドラッグ選択して離した瞬間に OS クリップボードへコピー
# emacs/vi 両モード対応(mode-keys の判定が環境依存のため両テーブルに登録)
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# OSC52 でエミュレータ経由クリップボード転送(Terminal.app は非対応なので実質保険)
set -g set-clipboard on

# WSL: プレフィックス + ] で Windows のクリップボードから貼り付け
# (ターミナル側の貼り付けキーが使えない環境でも動くように tmux 側で持つ。
#  Get-Clipboard の出力は CRLF なので tr で \r を除去する)
if-shell 'command -v powershell.exe >/dev/null' \
  'bind ] run-shell "powershell.exe -NoProfile Get-Clipboard | tr -d \"\\r\" | tmux load-buffer - && tmux paste-buffer -p"'

# マシン固有の設定があれば最後に読み込む(git 管理外)
if-shell 'test -r ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'

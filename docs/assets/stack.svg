<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="660"
  viewBox="0 0 760 660"
>
  <defs>
    <style>
      .bg { fill:#0b0f14; }

      .box {
        fill:#161b22;
        stroke:#3b4552;
        stroke-width:2;
        rx:18;
      }

      .primary {
        fill:#102846;
        stroke:#2f93ff;
        stroke-width:2.5;
        rx:18;
      }

      .cli {
        fill:#1b222c;
        stroke:#44505f;
        stroke-width:1.5;
        rx:12;
      }

      .title {
        fill:#ffffff;
        font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
        text-anchor:middle;
      }

      .subtitle {
        fill:#8b98a8;
        font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
        text-anchor:middle;
      }

      .cliText {
        fill:#dbe8f7;
        font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
        text-anchor:middle;
        dominant-baseline:middle;
      }

      .note {
        fill:#87bfff;
        font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      }

      .arrow {
        fill:none;
        stroke:#6e7d90;
        stroke-width:2;
        marker-end:url(#arrowHead);
      }
    </style>

    <marker id="arrowHead"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="3"
      orient="auto">
      <path d="M0,0 L6,3 L0,6Z" fill="#6e7d90"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="660"/>

  <!-- OS -->
  <rect class="box" x="120" y="30" width="520" height="70" rx="18"/>
  <text class="subtitle" x="380" y="55">OS</text>
  <text class="title" x="380" y="82">macOS / Linux / Windows + WSL</text>

  <path class="arrow" d="M380 100 V130"/>

  <!-- Terminal -->
  <rect class="box" x="120" y="130" width="520" height="70" rx="18"/>
  <text class="subtitle" x="380" y="155">Terminal Emulator</text>
  <text class="title" x="380" y="182">Terminal.app / Windows Terminal / etc.</text>

  <path class="arrow" d="M380 200 V230"/>

  <!-- Shell -->
  <rect class="box" x="120" y="230" width="520" height="70" rx="18"/>
  <text class="subtitle" x="380" y="255">Shell(設定はNix管理)</text>
  <text class="title" x="380" y="282">zsh</text>

  <path class="arrow" d="M380 300 V335"/>

  <!-- herdr -->
  <rect class="primary" x="120" y="335" width="520" height="110" rx="18"/>
  <text class="subtitle" x="380" y="365">Terminal Multiplexer</text>
  <text
    x="380"
    y="408"
    text-anchor="middle"
    fill="#5dc1ff"
    style="font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif">
    herdr
  </text>

  <path class="arrow" d="M380 445 V475"/>

  <!-- CLI -->
  <text class="subtitle" x="380" y="505">CLI Applications ・ zshから起動</text>

  <rect class="cli" x="170" y="525" width="120" height="60" rx="12"/>
  <rect class="cli" x="320" y="525" width="120" height="60" rx="12"/>
  <rect class="cli" x="470" y="525" width="120" height="60" rx="12"/>

  <text class="cliText" x="230" y="555">Neovim</text>
  <text class="cliText" x="380" y="555">fzf</text>
  <text class="cliText" x="530" y="555">zoxide</text>

  <!-- Nix group(zshの設定 + herdr + CLI をまとめて外側から囲む) -->
  <rect
      x="100"
      y="210"
      width="560"
      height="395"
      rx="24"
      fill="none"
      stroke="#2f93ff"
      stroke-width="2"
      stroke-dasharray="8 6"/>

  <text class="note" x="380" y="635" text-anchor="middle">
    青枠 = Nix + Home Manager が導入・設定を管理(zsh はバイナリを除く)
  </text>

</svg>

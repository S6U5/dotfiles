<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dotfiles 設定ファイル配置図">
  <title>dotfiles 設定ファイル配置図</title>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .caption { fill: #898781; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .heading { fill: #0b0b0b; font-size: 15px; font-weight: 700; }
    .mono { fill: #0b0b0b; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Section A: zsh 設定は nix/home.nix(programs.zsh)が生成 -->
  <text x="300" y="20" text-anchor="middle" fill="#1f9d67" font-size="12" font-weight="700">nix/home.nix(programs.zsh)が生成</text>

  <rect x="20" y="26" width="250" height="34" rx="9" fill="#eafbf3" stroke="#1f9d67" stroke-width="1.25" />
  <text x="145" y="48" text-anchor="middle" class="heading" fill="#0f6b46">nix/home.nix</text>
  <rect x="330" y="26" width="250" height="34" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5" />
  <text x="455" y="48" text-anchor="middle" class="heading" fill="#184f95">$HOME</text>

  <rect x="20" y="68" width="250" height="36" rx="8" fill="#f6fdf9" stroke="#bfe8d4" stroke-width="1.25" />
  <text x="36" y="90" class="mono">programs.zsh</text>
  <line x1="270" y1="86" x2="328" y2="86" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)" />
  <rect x="330" y="68" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="90" class="mono">~/.zshenv</text>

  <rect x="20" y="112" width="250" height="36" rx="8" fill="#f6fdf9" stroke="#bfe8d4" stroke-width="1.25" />
  <text x="36" y="134" class="mono">programs.zsh</text>
  <line x1="270" y1="130" x2="328" y2="130" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)" />
  <rect x="330" y="112" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="134" class="mono">~/.config/zsh/.zshrc</text>

  <line x1="20" y1="160" x2="580" y2="160" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Section B: install.sh がシンボリックリンク -->
  <text x="300" y="176" text-anchor="middle" fill="#184f95" font-size="12" font-weight="700">install.sh がシンボリックリンク</text>

  <rect x="20" y="188" width="250" height="34" rx="9" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="145" y="210" text-anchor="middle" class="heading">home/(リポジトリ)</text>
  <rect x="330" y="188" width="250" height="34" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5" />
  <text x="455" y="210" text-anchor="middle" class="heading" fill="#184f95">$HOME</text>

  <rect x="20" y="230" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="252" class="mono">.tmux.conf</text>
  <line x1="270" y1="248" x2="328" y2="248" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="230" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="252" class="mono">~/.tmux.conf</text>

  <rect x="20" y="274" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="296" class="mono">.config/shell/</text>
  <line x1="270" y1="292" x2="328" y2="292" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="274" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="296" class="mono">~/.config/shell/</text>

  <rect x="20" y="318" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="340" class="mono">.local/bin/</text>
  <line x1="270" y1="336" x2="328" y2="336" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="318" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="340" class="mono">~/.local/bin/</text>

  <text x="300" y="380" text-anchor="middle" fill="#898781" font-size="10.5">install.sh 管理分は既存ファイルを上書きせずスキップ+警告(--force で退避後に置換)</text>

</svg>

<svg width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dotfiles 設定ファイル配置図">
  <title>dotfiles 設定ファイル配置図</title>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .caption { fill: #898781; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .heading { fill: #0b0b0b; font-size: 15px; font-weight: 700; }
    .mono { fill: #0b0b0b; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- install.sh が home/ 以下を $HOME へシンボリックリンクする(zsh も他のファイルと同じ扱い) -->
  <text x="300" y="20" text-anchor="middle" fill="#184f95" font-size="12" font-weight="700">install.sh がシンボリックリンク(zsh も他の設定ファイルと同じ扱い)</text>

  <rect x="20" y="28" width="250" height="34" rx="9" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="145" y="50" text-anchor="middle" class="heading">home/(リポジトリ)</text>
  <rect x="330" y="28" width="250" height="34" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5" />
  <text x="455" y="50" text-anchor="middle" class="heading" fill="#184f95">$HOME</text>

  <rect x="20" y="74" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="96" class="mono">.zshenv</text>
  <line x1="270" y1="92" x2="328" y2="92" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="74" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="96" class="mono">~/.zshenv</text>

  <rect x="20" y="122" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="144" class="mono">.config/zsh/.zshrc</text>
  <line x1="270" y1="140" x2="328" y2="140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="122" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="144" class="mono">~/.config/zsh/.zshrc</text>

  <rect x="20" y="170" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="192" class="mono">.config/shell/</text>
  <line x1="270" y1="188" x2="328" y2="188" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="170" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="192" class="mono">~/.config/shell/</text>

  <rect x="20" y="218" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="240" class="mono">.tmux.conf</text>
  <line x1="270" y1="236" x2="328" y2="236" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="218" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="240" class="mono">~/.tmux.conf</text>

  <rect x="20" y="266" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="36" y="288" class="mono">.local/bin/</text>
  <line x1="270" y1="284" x2="328" y2="284" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow2)" />
  <rect x="330" y="266" width="250" height="36" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.25" />
  <text x="346" y="288" class="mono">~/.local/bin/</text>

  <line x1="20" y1="322" x2="580" y2="322" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 3" />

  <text x="300" y="352" text-anchor="middle" fill="#898781" font-size="10.5">install.sh 管理分は既存ファイルを上書きせずスキップ+警告(--force で退避後に置換)</text>
  <text x="300" y="370" text-anchor="middle" fill="#898781" font-size="10.5">bash のみ例外(~/.bashrc / ~/.bash_profile はブートストラップ方式、下部の別図参照なし・README本文参照)</text>

</svg>

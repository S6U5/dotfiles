name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck shfmt
      - name: Lint shell scripts
        run: ./scripts/lint.sh

name: Lint

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りのみに最小化(公開後は外部 PR でも実行されるため)
permissions:
  contents: read

# 同じ PR への連続 push では古い実行を打ち切る(main への push は打ち切らない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名 lint は main の required status check として参照されているため変えない
  # (docs/decisions/oss-publish-plan.md)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck, shfmt and zsh
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck shfmt zsh
      - name: Lint shell scripts
        run: ./scripts/lint.sh
      - name: Load shell config in dash / bash / zsh
        # 静的検査では分からない「実際に読み込めるか」「関数が定義されるか」「cd 系の終了コード」を
        # 確かめる(Nix 不要。home-manager-test とは独立に、速いこちらで落とす)
        run: ./scripts/test-shell.sh

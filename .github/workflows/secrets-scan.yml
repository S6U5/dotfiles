# 機密情報の混入チェック(CI 側の二段目。一段目は .githooks/pre-commit)
# pre-commit フックは --no-verify で素通りできるため、CI でも必ず検査する
name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴を検査する
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

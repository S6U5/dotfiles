# 機密情報の混入チェック(CI 側の二段目。一段目は .githooks/pre-commit)
# pre-commit フックは --no-verify で素通りできるため、CI でも必ず検査する
#
# gitleaks は Action(gitleaks/gitleaks-action。商用 EULA)ではなく、
# MIT ライセンスの CLI 本体をバージョン・チェックサム固定で直接実行する
# (CLAUDE.md「組み込みは無償かつ OSS ライセンスのみ」の方針のため)。
# 誤検知の回避は .gitleaks.toml の allowlist(secrets-allow コメント)を参照。
name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りのみに最小化(公開後は外部 PR でも実行されるため)
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全履歴を検査する
      - name: Install gitleaks(バージョン・チェックサム固定)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Run gitleaks(全履歴)
        run: ./gitleaks git --redact --no-banner
      - name: List secrets-allow suppressions(目視レビュー用に一覧化)
        # secrets-allow コメント1つでローカルフック・gitleaks・CI の全層が同時に素通りするため、
        # 抑制箇所を CI ログに警告として一覧化し、必ず人間の目に触れるようにする(検査は落とさない)。
        # 検出パターンや allowlist を定義する仕組み側のファイルは除外する。
        if: always()
        run: |
          hits=$(git grep -n -- 'secrets-allow' \
            ':!.githooks/pre-commit' ':!.gitleaks.toml' ':!.github/workflows/secrets-scan.yml' || true)
          if [ -n "$hits" ]; then
            echo "::warning::secrets-allow による抑制があります。本当に機密でないか目視確認してください:"
            printf '%s\n' "$hits"
          else
            echo "secrets-allow による抑制はありません。"
          fi

name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run install test
        run: ./scripts/test-install.sh

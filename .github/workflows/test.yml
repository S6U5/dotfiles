name: Test

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りのみに最小化(公開後は外部 PR でも実行されるため)
permissions:
  contents: read

# 同じ PR への連続 push では古い実行を打ち切る(main への push は打ち切らない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名 home-manager-test は main の required status check として参照されているため変えない
  # (docs/decisions/oss-publish-plan.md)
  home-manager-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Nix のダウンロード・ビルドが詰まったときに既定の 6 時間を使い切らないようにする
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        # nix-installer を未固定の curl|sh で取得する代わりに、SHA 固定した公式 action を使う。
        # この action 自体が dependabot.yml の github-actions エコシステムで追跡され、
        # actions/checkout と同様に SHA が自動更新される(固定しても更新は止まらない)。
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: experimental-features = nix-command flakes
      - name: Run home-manager test
        # CI ランナーは使い捨てなので、DOTFILES_TEST_SWITCH=1 で実際の switch(activate)まで検証する。
        # nix-installer 導入直後は同一シェルにまだ nix コマンドが乗っていないため、
        # nix-daemon のプロファイルスクリプトを明示的に source してから実行する。
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          DOTFILES_TEST_SWITCH=1 ./scripts/test-home-manager.sh

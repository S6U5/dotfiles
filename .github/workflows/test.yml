name: Test

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りのみに最小化(公開後は外部 PR でも実行されるため)
permissions:
  contents: read

jobs:
  home-manager-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        run: curl -sSfL https://artifacts.nixos.org/nix-installer | sh -s -- install --enable-flakes --no-confirm
      - name: Run home-manager test
        # CI ランナーは使い捨てなので、DOTFILES_TEST_SWITCH=1 で実際の switch(activate)まで検証する。
        # nix-installer 導入直後は同一シェルにまだ nix コマンドが乗っていないため、
        # nix-daemon のプロファイルスクリプトを明示的に source してから実行する。
        # NIX_CONFIG の access-tokens は、Nix が github:... の flake 入力を取得する際の
        # api.github.com 呼び出しを認証付きにするため。共有ランナー(特に macos)の IP は
        # 未認証のレート制限(60回/時)を高頻度で使い果たしており、断続的な
        # 「HTTP 403: API rate limit exceeded」で build が落ちる原因になっていた。
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          DOTFILES_TEST_SWITCH=1 ./scripts/test-home-manager.sh

# GitHub Actions で使うアクションのバージョン更新を自動 PR 化する。
# 更新頻度は weekly(OSS 公開に伴い monthly から引き上げ。nixpkgs-unstable 追跡の
# 思想に合わせる。脆弱性発覚時の修正 PR はこのスケジュールと無関係に即時来る
# — リポジトリ設定の automated security fixes で有効化済み)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # リリースから7日経つまで更新 PR を出さない(公開直後の汚染バージョンを掴まないため)。
    # 未設定でも既定で3日効くが、GitHub Actions は npm 等に比べて汚染の検出が遅れる傾向が
    # あるので延ばしている(tj-actions/changed-files の改ざんは検出まで2〜4日かかった)。
    # - セキュリティ更新(GitHub Advisory 由来)は cooldown の対象外で即時来る
    # - タグ書き換え型の攻撃には cooldown は効かない。そちらはアクションを
    #   フルコミットハッシュで固定することで対策済み(AGENTS.md 参照)
    # - nix 側に設定していないのは、nixpkgs-unstable が毎日更新されるため「最新版が常に
    #   クールダウン期間内」となって更新が止まる不具合(dependabot-core#13691)を
    #   踏むリスクが高いから
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # nix/flake.lock の入力(nixpkgs 等)のバージョン更新を自動 PR 化する
  - package-ecosystem: nix
    directory: /nix
    schedule:
      interval: weekly
    groups:
      flake-inputs:
        patterns: ["*"]
